plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'markit'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // 시간 데이터포맷
    implementation 'org.apache.commons:commons-lang3:3.10'

    // 비밀번호 암호화
    implementation 'org.springframework.security:spring-security-crypto'

    // JWT 라이브러리 (Auth0)
    implementation 'com.auth0:java-jwt:4.4.0'

    // 이메일 전송
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // 스웨거
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.2.0'

    // 웹소켓
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    // AppConfig용
    implementation 'org.apache.httpcomponents.client5:httpclient5'

    // 토스 결제용 JSON
    implementation 'net.minidev:json-smart:2.5.2'

    // WebClient
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    // ✅ Querydsl
    implementation 'com.querydsl:querydsl-jpa:5.1.0:jakarta'
    annotationProcessor 'com.querydsl:querydsl-apt:5.1.0:jakarta'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

    // ✅ 공간 데이터
    implementation 'com.querydsl:querydsl-spatial:5.1.0'
    implementation 'org.hibernate.orm:hibernate-spatial:6.2.7.Final'
    annotationProcessor 'com.querydsl:querydsl-spatial:5.1.0'

    // ✅ Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'com.h2database:h2'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // 번역 기능
    implementation 'com.google.cloud:google-cloud-translate:2.38.0'
}

def querydslDir = "$buildDir/generated/querydsl"

sourceSets {
    main.java.srcDirs += [ querydslDir ]
}

tasks.withType(JavaCompile) {
    options.annotationProcessorGeneratedSourcesDirectory = file(querydslDir)
}

clean.doLast {
    delete file(querydslDir)
}

tasks.named('test') {
    useJUnitPlatform()
}
